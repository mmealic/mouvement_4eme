<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>En mouvement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: four stations in a row of tabs; each station = simulation card, notebook note, questions. A notebook drawer collects all notes. */
:root{
  --bg:#eef2f6; --card:#ffffff; --ink:#172031; --muted:#576277; --line:#d1d8e2;
  --s1:#7a3fd1; --s2:#e2581c; --s3:#14866d; --s4:#1f62d6;
  --paper:#fffdf7; --rule:#c8d9ef; --margin:#e5737a; --mark:#ffe36e; --pen:#1d3d8f;
  --ok:#1b7f45; --ok-bg:#dcf3e4; --bad:#b92a36; --bad-bg:#fbe1e3;
  --sky:#d9ecfb; --ground:#9ccc7a; --road:#3d4552;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif; --hand:"Patrick Hand","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121823; --card:#1b2332; --ink:#edf1f8; --muted:#a3adc2; --line:#334055;
    --s1:#b591ff; --s2:#ff8a57; --s3:#4fd1ae; --s4:#7aa8ff; --paper:#f7f4ea; --ok:#6bd896; --ok-bg:#173d2a; --bad:#ff8d94; --bad-bg:#4a1f25;
    --sky:#1f3550; --ground:#3f6b37; --road:#2a303a; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#121823; --card:#1b2332; --ink:#edf1f8; --muted:#a3adc2; --line:#334055;
  --s1:#b591ff; --s2:#ff8a57; --s3:#4fd1ae; --s4:#7aa8ff; --paper:#f7f4ea; --ok:#6bd896; --ok-bg:#173d2a; --bad:#ff8d94; --bad-bg:#4a1f25;
  --sky:#1f3550; --ground:#3f6b37; --road:#2a303a; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:400 17px/1.5 var(--body)}
.wrap{max-width:1000px; margin:0 auto; padding-inline:16px; padding-block:14px 60px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--s4); outline-offset:2px}
header{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
header h1{font:700 clamp(26px,5vw,38px)/1.1 var(--display); margin:0 auto 0 0}
.pill{background:var(--card); border:2px solid var(--line); border-radius:999px; padding:4px 12px; font-weight:700; font-size:15px}
button.pill{border-color:var(--ink)}
.sub{color:var(--muted); margin:4px 0 14px}
nav{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px}
@media (max-width:640px){nav{grid-template-columns:1fr 1fr}}
.st{border:2px solid var(--line); border-bottom-width:5px; border-radius:16px; background:var(--card); padding:10px 12px; text-align:left}
.st b{display:block; font:700 17px/1.2 var(--display)} .st span{font-size:14px; color:var(--muted)}
.st[aria-selected="true"]{border-color:var(--zc); background:color-mix(in srgb,var(--zc) 12%,var(--card))}
.st i{font-style:normal; font-weight:700; font-size:13px; color:var(--zc); display:block; margin-top:2px}
main{margin-top:14px}
.intro h2{font:700 26px/1.2 var(--display); margin:0 0 10px; color:var(--zc)}
.sim+.sim{margin-top:14px}
.lanes .btn{padding:4px 10px; font-size:14px}
.intro p{margin:0 0 12px; max-width:60ch}
.sim{background:var(--card); border:2px solid var(--line); border-radius:20px; padding:14px}
.sim h3,.qs h3{font:700 19px var(--display); margin:0 0 8px}
.sim svg{display:block; width:100%; height:auto; border-radius:12px; touch-action:none}
.ctl{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px}
.btn{border:2px solid var(--ink); border-bottom-width:4px; border-radius:12px; background:var(--card); padding:8px 14px; font-weight:700; user-select:none; -webkit-user-select:none}
.btn.on,.btn[aria-pressed="true"]{background:var(--ink); color:var(--card)}
.btn.big{font:700 19px var(--display); padding:12px 20px; min-width:130px}
.btn.gas{border-color:var(--s3)} .btn.brk{border-color:var(--bad)}
.btn.gas.on{background:var(--s3); color:#fff} .btn.brk.on{background:var(--bad); color:#fff}
.lab{font-weight:700; font-size:14px; color:var(--muted); margin-right:2px}
.read{display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:8px; font-variant-numeric:tabular-nums}
.read b{font:700 22px var(--display)}
.tag{display:inline-block; border-radius:999px; padding:3px 12px; font-weight:700; color:#fff; background:var(--zc)}
.sl{display:block; flex:1 1 220px; font-weight:700; font-size:15px; color:var(--muted)}
.sl input{display:block; width:100%; accent-color:var(--zc); height:28px}
.mis{list-style:none; padding:0; margin:10px 0 0; display:grid; gap:6px}
.mis li{border:2px solid var(--line); border-radius:12px; padding:6px 10px; background:var(--bg)}
.mis li.done{border-color:var(--ok); background:var(--ok-bg)} .mis li.cur{border-color:var(--zc)}
.formula{font:700 22px var(--display); background:var(--bg); border-radius:12px; padding:8px 12px; margin-top:10px; font-variant-numeric:tabular-nums}
.note{margin:18px 0; background:#fffefb; color:#1e2533; border:1px solid var(--line); border-radius:4px; padding:6px 16px 10px; font:400 17.5px/28px "Nunito",var(--body);
  background-image:repeating-linear-gradient(transparent 0 27px,#dfe8f3 27px 28px); background-position:0 6px}
.note .nh{font-weight:400; font-size:14px; color:#6b7280}
.note h4{font:600 19px/28px "Nunito",var(--body); margin:0; text-decoration:underline; text-underline-offset:4px}
.note p{margin:0} .note b,.note strong{font-weight:400}
.note mark{background:#fff27a; color:inherit; padding:0 2px; font-weight:400}
.note .f{text-decoration:underline; text-underline-offset:4px}
.qs{margin-top:6px; display:grid; gap:12px}
.q{border:2px solid var(--line); border-radius:14px; padding:12px; background:var(--card)}
.q>p{margin:0 0 8px; font-weight:700}
.q svg{display:block; width:100%; max-width:440px; height:auto; margin:0 0 8px}
.opts{display:grid; gap:6px}
.opt{text-align:left; border:2px solid var(--line); border-bottom-width:3px; border-radius:10px; background:var(--bg); padding:8px 12px}
.opt.good{border-color:var(--ok); background:var(--ok-bg)} .opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt:disabled{cursor:default; color:inherit}
.num{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.num input{width:130px; font:700 18px var(--body); color:var(--ink); background:var(--bg); border:2px solid var(--line); border-radius:10px; padding:6px 10px}
.why{margin:8px 0 0; font-size:15px} .why b{color:var(--ok)} .why b.no{color:var(--bad)}
.nextb{margin-top:16px}
.drawer{position:fixed; inset:0; background:rgba(10,14,24,.55); display:flex; justify-content:flex-end; z-index:5}
.drawer[hidden]{display:none}
.dpanel{background:var(--bg); width:min(560px,100%); height:100%; overflow-y:auto; padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px))}
.dpanel header{margin-bottom:6px}
.dpanel h2{font:700 24px var(--display); margin:0 auto 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <header><h1 id="h1"></h1><span class="pill" id="score"></span></header>
  <nav id="nav" role="tablist"></nav>
  <main id="main"></main>
</div>

 {id:"s1", col:"--s1", title:B("Décrire un mouvement","Describing motion"), sub:B("Trajectoire et vitesse","Path and speed"),

     UI.movers.forEach((m,i)=>{ const h=d/m[1], y=18+i*35, w=Math.max(4,300*Math.log10(1+h*60)/mx); g+=`<text x="8" y="${y+18}" style="font-size:20px">${m[2]}</text><rect x="40" y="${y+4}" width="${w.toFixed(1)}" height="20" rx="6" fill="var(--zc)" opacity=".85"/><text x="${(46+w).toFixed(1)}" y="${y+19}" style="font:700 13px var(--body);fill:var(--ink)">${tTxt2(h)}</text>`; });
     $("#trv").innerHTML=g; };
   $$(".tp").forEach(b=>b.onclick=()=>{ ti=+b.dataset.i; $$(".tp").forEach(x=>x.classList.toggle("on",x===b)); trips(); }); trips();
   const cv=()=>{ const k=+$("#cvs").value; $("#cvsv").textContent=k+" km/h"; $("#cvf").innerHTML=`${k} km/h ÷ 3,6 = <span style="color:var(--zc)">${fmt(r2(k/3.6))} m/s</span>`.replace("3,6",LANG==="fr"?"3,6":"3.6"); };
   $("#cvs").oninput=cv; cv(); } },
 s4:{ html:()=>`<div class="ctl" style="margin-top:0">${["train","para","moon","carou"].map((k,i)=>`<button class="btn sc${i?"":" on"}" data-k="${k}">${T(UI.frames[k])}</button>`).join("")}</div>
   <svg id="rv" viewBox="0 0 440 220" role="img" aria-label="scene" style="margin-top:10px"></svg>
   <div class="ctl"><span class="lab">${T(UI.ref)}</span><span id="rbtn"></span></div><p id="rtxt" style="margin:8px 0 0;font-weight:700"></p>`,
  mount(){ let sc="train", rf=0, trail=[]; const sv=$("#rv");
   const btns=()=>{ $("#rbtn").innerHTML=UI.refs[sc].map((r,i)=>`<button class="btn rf${i===rf?" on":""}" data-i="${i}">${T(r)}</button>`).join(" "); $$(".rf").forEach(b=>b.onclick=()=>{ rf=+b.dataset.i; trail=[]; btns(); }); $("#rtxt").textContent=T(UI.sceneTxt[sc][rf]); };
   $$(".sc").forEach(b=>b.onclick=()=>{ sc=b.dataset.k; rf=0; trail=[]; $$(".sc").forEach(x=>x.classList.toggle("on",x===b)); btns(); });
   btns();
   const train=t=>{ const trx=rf?60:((t*90)%760)-320, shift=rf?-((t*90)%880):0; let g=`<rect width="440" height="220" fill="var(--sky)"/><rect y="170" width="440" height="50" fill="var(--ground)"/>`;
     for(let k=-1;k<=1;k++){ const b=shift+k*880; if(b>440||b+880<0) continue;
       for(let j=0;j<8;j++){ const lx=b+j*110+40; if(lx>-20&&lx<460) g+=`<rect x="${lx.toFixed(1)}" y="70" width="6" height="100" fill="#8a94a6"/><circle cx="${(lx+3).toFixed(1)}" cy="68" r="7" fill="#ffd66b"/>`; }
       g+=`<rect x="${b.toFixed(1)}" y="160" width="880" height="14" fill="#b9a68a"/>${MAN(b+150,160,"var(--s2)")}<text x="${(b+150).toFixed(1)}" y="104" text-anchor="middle" style="font:700 13px var(--body);fill:var(--ink)">${UI.names.lea}</text>`; }
     g+=`<rect x="${trx.toFixed(1)}" y="96" width="300" height="56" rx="12" fill="var(--zc)"/>`;
     for(let w=0;w<5;w++) g+=`<rect x="${(trx+20+w*56).toFixed(1)}" y="106" width="40" height="24" rx="4" fill="#d8ecff"/>`;
     g+=`<circle cx="${(trx+96).toFixed(1)}" cy="116" r="7" fill="var(--ink)"/><rect x="${(trx+90).toFixed(1)}" y="122" width="12" height="8" fill="var(--ink)"/><text x="${(trx+96).toFixed(1)}" y="90" text-anchor="middle" style="font:700 13px var(--body);fill:var(--ink)">${UI.names.tom}</text>`;
     g+=`<circle cx="${(trx+50).toFixed(1)}" cy="156" r="8" fill="#333"/><circle cx="${(trx+250).toFixed(1)}" cy="156" r="8" fill="#333"/>`;
     return g; };
   const para=t=>{ const p=(t%6)/6, H=220; let g=`<rect width="440" height="220" fill="var(--sky)"/>`;
     const gy=rf?260-p*95:178, py=rf?92:20+p*140, plx=rf?(120+t*60)%560-60:(t*60)%560-60, ply=rf?40-p*95:30;
     g+=`<g transform="translate(${plx.toFixed(1)} ${ply.toFixed(1)})"><path d="M-30 0h50l10 -6v12l-10 -6" fill="#8a94a6"/><path d="M-6 0l-12 -12h8l12 12zM-6 0l-12 12h8l12 -12z" fill="#6b7586"/></g>`;
     g+=`<rect y="${gy.toFixed(1)}" width="440" height="${Math.max(0,H-gy+40).toFixed(1)}" fill="var(--ground)"/>`;
     [60,170,300,390].forEach(x=>g+=`<circle cx="${x}" cy="${(gy-14).toFixed(1)}" r="16" fill="#3e8e41"/><rect x="${x-3}" y="${(gy-8).toFixed(1)}" width="6" height="10" fill="#7a5230"/>`);
     g+=`<g transform="translate(220 ${py.toFixed(1)})"><path d="M-34 0A34 22 0 0 1 34 0Z" fill="var(--zc)"/><path d="M-30 0L-4 34M30 0L4 34M0 0V34" stroke="var(--ink)" stroke-width="1.5"/>${MAN(0,58,"var(--ink)",.75)}</g>`;
     return g; };
   const moon=(t,dt)=>{ let g=`<rect width="440" height="220" rx="12" fill="#0e1424"/>`; for(let i=0;i<40;i++) g+=`<circle cx="${(i*97)%440}" cy="${(i*53)%220}" r="1" fill="#fff" opacity=".6"/>`;
     const cx=220, cy=110;
     if(!rf){ const a=t*1.4, mx=cx+75*Math.cos(a), my=cy+75*Math.sin(a)*.8; g+=`<ellipse cx="${cx}" cy="${cy}" rx="75" ry="60" fill="none" stroke="#9aa6c0" stroke-dasharray="4 5"/><circle cx="${cx}" cy="${cy}" r="18" fill="#3f88e0"/><text x="${cx}" y="${cy+36}" text-anchor="middle" style="font:700 12px var(--body);fill:#e7ecf6">${T(UI.names.earth)}</text><circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="7" fill="#d9d9d9"/><text x="${mx.toFixed(1)}" y="${(my-12).toFixed(1)}" text-anchor="middle" style="font:700 12px var(--body);fill:#e7ecf6">${T(UI.names.moon)}</text>`; }
     else { const A=t*.22, ex=cx+150*Math.cos(A), ey=cy+80*Math.sin(A), a=t*.22*7, mx=ex+10*Math.cos(a), my=ey+10*Math.sin(a); trail.push([mx,my]); if(trail.length>900) trail.shift();
       g+=`<ellipse cx="${cx}" cy="${cy}" rx="150" ry="80" fill="none" stroke="#3f88e0" stroke-dasharray="4 5" opacity=".7"/><circle cx="${cx}" cy="${cy}" r="22" fill="#ffc83d"/><text x="${cx}" y="${cy+40}" text-anchor="middle" style="font:700 12px var(--body);fill:#e7ecf6">${T(UI.names.sun)}</text>`;
       if(trail.length>1) g+=`<path d="M${trail.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L")}" fill="none" stroke="#d9d9d9" stroke-width="1.6" opacity=".85"/>`;
       g+=`<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="8" fill="#3f88e0"/><circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="4" fill="#fff"/>`; }
     return g; };
   const carou=t=>{ const cx=220,cy=120,R=110, w=t*.9; let g=`<rect width="440" height="220" fill="var(--sky)"/><rect y="150" width="440" height="70" fill="var(--ground)"/>`;
     const a0=rf?0:w, dad=rf?-w:0, P=a=>[cx+R*Math.cos(a), cy+R*.3*Math.sin(a)];
     g+=`<ellipse cx="${cx}" cy="${cy+10}" rx="${R+14}" ry="${(R+14)*.3}" fill="#c06a3a"/><ellipse cx="${cx}" cy="${cy}" rx="${R+14}" ry="${(R+14)*.3}" fill="#f3b562"/><rect x="${cx-5}" y="20" width="10" height="${cy-20}" fill="#8a5a3a"/><path d="M${cx-130} 40L${cx} 6L${cx+130} 40Z" fill="var(--bad)"/>`;
     for(let i=0;i<6;i++){ const a=a0+i*Math.PI/3, p=P(a); g+=`<path d="M${p[0].toFixed(1)} 40V${p[1].toFixed(1)}" stroke="#d9d9d9" stroke-width="2"/>`+(i?`<circle cx="${p[0].toFixed(1)}" cy="${(p[1]-8).toFixed(1)}" r="8" fill="#fff" stroke="#9aa"/>`:""); }
     const ip=P(a0); g+=MAN(ip[0],ip[1],"var(--s1)",.8)+`<text x="${ip[0].toFixed(1)}" y="${(ip[1]-36).toFixed(1)}" text-anchor="middle" style="font:700 13px var(--body);fill:var(--ink)">Inès</text>`;
     const dp=[cx+(R+60)*Math.cos(dad+Math.PI*.15), cy+30+(R+60)*.28*Math.sin(dad+Math.PI*.15)]; g+=MAN(dp[0],dp[1]+40,"var(--s2)",1)+`<text x="${dp[0].toFixed(1)}" y="${(dp[1]-4).toFixed(1)}" text-anchor="middle" style="font:700 13px var(--body);fill:var(--ink)">${LANG==="fr"?"Papa":"Dad"}</text>`;
     return g; };
   loop((t,dt)=>{ sv.innerHTML=sc==="train"?train(t):sc==="para"?para(t):sc==="moon"?moon(t,dt):carou(t); }); } }
};

/* ================================ render ================================ */
const PIC={
 s1:()=>{ const ink="#1e2533", lab=(x,t)=>`<text x="${x}" y="98" text-anchor="middle" style="font:400 14px Nunito,var(--body);fill:${ink}">${t}</text>`, dot=(x,y)=>`<circle cx="${x}" cy="${y}" r="4" fill="${ink}"/>`;
   let g=`<path d="M14 50H126" stroke="${ink}" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>${lab(70,T(B("rectiligne","straight")))}`;
   g+=`<circle cx="210" cy="50" r="34" stroke="${ink}" stroke-width="2.5" fill="none"/><path d="M244 46l-4 10 9-3" stroke="${ink}" stroke-width="2.5" fill="none"/>${lab(210,T(B("circulaire","circular")))}`;
   g+=`<path d="M300 70C320 10 350 10 365 50S410 90 426 30" stroke="${ink}" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>${lab(362,T(B("curviligne","curved")))}`;
   const row=(y,xs,t)=>xs.map(x=>dot(x,y)).join("")+`<text x="270" y="${y+5}" style="font:400 14px Nunito,var(--body);fill:${ink}">${t}</text>`;
   g+=row(130,[20,58,96,134,172,210,248],T(B("uniforme : écarts égaux","constant: equal gaps")))+row(158,[20,26,36,52,76,110,154,210],T(B("accéléré : écarts qui grandissent","speeding up: growing gaps")))+row(186,[20,76,120,154,178,194,204,210],T(B("ralenti : écarts qui rétrécissent","slowing down: shrinking gaps")));
   return `<svg viewBox="0 0 540 200" style="display:block;width:100%;max-width:600px;margin:8px 0 2px"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${ink}"/></marker></defs>${g}</svg>`; },
 s4:()=>{ const ink="#1e2533", t=(x,y,s)=>`<text x="${x}" y="${y}" text-anchor="middle" style="font:400 14px Nunito,var(--body);fill:${ink}">${s}</text>`;
   let g=`<circle cx="100" cy="70" r="46" stroke="${ink}" stroke-width="2" stroke-dasharray="4 4" fill="none"/><circle cx="100" cy="70" r="14" fill="none" stroke="${ink}" stroke-width="2.5"/>${t(100,74,"T")}<circle cx="146" cy="70" r="6" fill="none" stroke="${ink}" stroke-width="2.5"/>${t(160,60,"L")}${t(100,140,T(B("géocentrique","geocentric")))}`;
   g+=`<circle cx="330" cy="70" r="56" stroke="${ink}" stroke-width="2" stroke-dasharray="4 4" fill="none"/><circle cx="330" cy="70" r="16" fill="none" stroke="${ink}" stroke-width="2.5"/>${t(330,74,"S")}<circle cx="386" cy="70" r="8" fill="none" stroke="${ink}" stroke-width="2.5"/>${t(400,56,"T")}${t(330,140,T(B("héliocentrique","heliocentric")))}`;
   return `<svg viewBox="0 0 440 150" style="display:block;width:100%;max-width:460px;margin:8px 0 2px">${g}</svg>`; }
};
function noteHTML(st){ return `<div class="note" style="--zc:var(${st.col})"><h4>${T(st.note.h)}</h4><p>${T(st.note.b)}</p>${PIC[st.id]?PIC[st.id]():""}</div>`; }
function seeded(id,n){ let s=7; for(const c of id) s=(s*31+c.charCodeAt(0))%9973; const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ s=(s*7919+17)%9973; const j=s%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function whyHTML(q,ok){ const right=q.num!=null?fmt(q.num)+" "+q.unit:T(q.o[0]);
  return `<p class="why"><b class="${ok?"":"no"}">${ok?T(UI.yes):T(B("Non, la bonne réponse est : ","No, the right answer is: "))+right+"."}</b> ${ok&&q.num!=null?T(UI.ans)+" : "+right+". ":""}${T(q.why)}</p>`; }
function qHTML(st,k){ const q=st.qs[k], id=st.id+"_"+k, done=ANS[id]!=null, fig=q.fig?chronoSVG(q.fig[0],q.fig[1]):"";
  const why=done?whyHTML(q,ANS[id]):"";
  if(q.num!=null) return `<div class="q" data-q="${id}"><p>${T(q.q)}</p><div class="num"><input inputmode="decimal" aria-label="${T(UI.ans)}" ${done?"disabled":""}><span>${q.unit}</span><button class="btn chk" ${done?"disabled":""}>${T(UI.check)}</button></div>${why}</div>`;
  const ord=seeded(id,q.o.length);
  return `<div class="q" data-q="${id}"><p>${T(q.q)}</p>${fig}<div class="opts">${ord.map(i=>`<button class="opt${done&&i===0?" good":""}" data-i="${i}" ${done?"disabled":""}>${T(q.o[i])}</button>`).join("")}</div>${why}</div>`; }
function render(){
  cancelAnimationFrame(RAF); TICKS=[]; if(keyH){ removeEventListener("keydown",keyH); removeEventListener("keyup",keyH); keyH=null; }
  document.documentElement.lang=LANG; $("#h1").textContent=T(UI.h1);
  $("#score").textContent=`✓ ${good()} / ${total()} ${T(UI.score)}`;
  $("#nav").innerHTML=STATIONS.map((s,i)=>{ const ok=s.qs.filter((_,k)=>ANS[s.id+"_"+k]===true).length; return `<button class="st" role="tab" data-s="${s.id}" aria-selected="${s.id===CUR}" style="--zc:var(${s.col})"><b>${i+1}. ${T(s.title)}</b><span>${T(s.sub)}</span><i>${ok} / ${s.qs.length}</i></button>`; }).join("");
  $$(".st").forEach(b=>b.onclick=()=>{ CUR=b.dataset.s; render(); });
  const st=STATIONS.find(s=>s.id===CUR), idx=STATIONS.indexOf(st), m=$("#main"); m.style.setProperty("--zc",`var(${st.col})`);
  m.innerHTML=`<div class="intro"><h2>${T(st.title)}</h2></div><section class="sim">${SIM[st.id].html()}</section>${noteHTML(st)}
    <section class="qs"><h3>${T(UI.qs)}</h3>${st.qs.map((_,k)=>qHTML(st,k)).join("")}</section>${idx<3?`<button class="btn big nextb" id="nx">${T(UI.next)}</button>`:""}`;
  SIM[st.id].mount();
  $$(".opt").forEach(b=>b.onclick=()=>answer(b, +b.dataset.i===0));
  $$(".chk").forEach(b=>{ const inp=b.parentElement.querySelector("input"); const go=()=>{ const q=qOf(b), v=parseFloat((LANG==="en"?inp.value.replace(/,(?=\d{3}(\D|$))/g,""):inp.value).replace(/\s/g,"").replace(",",".")); if(isNaN(v)) return; answer(b, Math.abs(v-q.num)<=Math.abs(q.num)*.011); }; b.onclick=go; inp.onkeydown=e=>{ if(e.key==="Enter") go(); }; });
  const nx=$("#nx"); if(nx) nx.onclick=()=>{ CUR=STATIONS[idx+1].id; render(); scrollTo({top:0,behavior:RM?"auto":"smooth"}); };
}
function qOf(el){ const id=el.closest(".q").dataset.q, [s,k]=id.split("_"); return STATIONS.find(x=>x.id===s).qs[+k]; }
function answer(el,ok){ const box=el.closest(".q"), id=box.dataset.q, q=qOf(el); ANS[id]=ok; save();
  box.querySelectorAll("button,input").forEach(x=>x.disabled=true);
  box.querySelectorAll(".opt").forEach(x=>{ if(+x.dataset.i===0) x.classList.add("good"); else if(x===el) x.classList.add("wrong"); });
  box.insertAdjacentHTML("beforeend",whyHTML(q,ok));
  $("#score").textContent=`✓ ${good()} / ${total()} ${T(UI.score)}`;
  const s=STATIONS.find(x=>x.id===CUR), i=$(`.st[data-s="${CUR}"] i`); if(i) i.textContent=`${s.qs.filter((_,k)=>ANS[s.id+"_"+k]===true).length} / ${s.qs.length}`; }
function openNotes(){ $("#dh").textContent=T(UI.nb); $("#dclose").textContent=T(UI.close); $("#dsub").textContent=T(UI.dsub); $("#dnotes").innerHTML=STATIONS.map(noteHTML).join(""); $("#drawer").hidden=false; $("#dclose").focus(); }
$("#dclose").onclick=()=>{ $("#drawer").hidden=true; };
$("#drawer").onclick=e=>{ if(e.target.id==="drawer") $("#drawer").hidden=true; };
addEventListener("keydown",e=>{ if(e.key==="Escape") $("#drawer").hidden=true; });

render();
</script>
